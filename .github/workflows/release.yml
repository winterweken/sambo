name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          make build-linux
          cp build/sambo-linux-* .
          sha256sum sambo-linux-* > checksums.txt

      - name: Release Linux Binaries
        uses: softprops/action-gh-release@v1
        with:
          files: |
            sambo-linux-amd64
            sambo-linux-arm64
            sambo-linux-arm
            checksums.txt
          body: |
            ## Sambo ${{ steps.version.outputs.VERSION }}

            Linux Share Management CLI

            ### Linux Installation
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/sambo-linux-amd64
            sudo mv sambo-linux-amd64 /usr/local/bin/sambo
            sudo chmod +x /usr/local/bin/sambo
            ```

            ### macOS Installation
            Download the `.pkg` installer from the Assets below.

            **Assets:**
            - `sambo-macos-amd64.pkg` (Intel)
            - `sambo-macos-arm64.pkg` (Apple Silicon)
            - `macos-client-setup.sh` (Standalone setup script)

          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: build-linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Make executable
        run: chmod +x scripts/*.sh

      - name: Build Packages
        run: make package-macos

      - name: Release macOS Packages
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/release/*.pkg
            scripts/macos-client-setup.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o sambo-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o sambo-linux-arm64 .
          GOOS=linux GOARCH=arm go build -ldflags="-s -w" -o sambo-linux-arm .
          sha256sum sambo-linux-* > checksums.txt

      - name: Release Linux Binaries
        uses: softprops/action-gh-release@v1
        with:
          files: |
            sambo-linux-amd64
            sambo-linux-arm64
            sambo-linux-arm
            checksums.txt
          body: |
            ## Sambo ${{ steps.version.outputs.VERSION }}

            Linux Share Management CLI

            ### Linux Installation
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/sambo-linux-amd64
            sudo mv sambo-linux-amd64 /usr/local/bin/sambo
            sudo chmod +x /usr/local/bin/sambo
            ```

            ### macOS Installation
            Download the `.pkg` installer from the Assets below.

          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"
          cache: false

      - name: Make executable
        run: chmod +x scripts/*.sh

      - name: Build Packages
        run: make package-macos

      - name: Release macOS Packages
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/release/*.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

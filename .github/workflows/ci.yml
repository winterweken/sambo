name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted. Run 'go fmt ./...'"
            gofmt -l .
            exit 1
          fi

      - name: Build
        run: go build -v ./...

      - name: Run tests
        run: go test -v ./...

  build:
    name: Build Multi-Architecture
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Build for multiple architectures
        run: |
          GOOS=linux GOARCH=amd64 go build -o sambo-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -o sambo-linux-arm64 .
          GOOS=linux GOARCH=arm go build -o sambo-linux-arm .

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: binaries
          path: sambo-linux-*
